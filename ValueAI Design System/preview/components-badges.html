<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-1); padding:16px 20px; font-family:var(--font-sans); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:var(--r-pill); font-family:var(--font-mono); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; }
  .b-blue { background:rgba(77,124,255,0.15); color:var(--electric); border:1px solid rgba(77,124,255,0.3); }
  .b-cyan  { background:rgba(95,217,255,0.12); color:var(--cyan); border:1px solid rgba(95,217,255,0.25); }
  .b-green { background:rgba(61,220,151,0.12); color:var(--good); border:1px solid rgba(61,220,151,0.25); }
  .b-warn  { background:rgba(255,181,71,0.12); color:var(--warn); border:1px solid rgba(255,181,71,0.25); }
  .b-red   { background:rgba(255,93,108,0.12); color:var(--bad); border:1px solid rgba(255,93,108,0.25); }
  .b-dim   { background:var(--bg-3); color:var(--fg-3); border:1px solid var(--line-2); }
  .b-ultra { background:rgba(138,92,255,0.12); color:var(--ultra); border:1px solid rgba(138,92,255,0.25); }
  .dot { width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block; }
</style>
</head><body>
<div class="row">
  <span class="badge b-blue"><span class="dot"></span>NEW</span>
  <span class="badge b-green"><span class="dot"></span>BEST VALUE</span>
  <span class="badge b-cyan">MULTIMODAL</span>
  <span class="badge b-warn">PRICE CHANGE</span>
  <span class="badge b-red">DEPRECATED</span>
  <span class="badge b-ultra">REASONING</span>
  <span class="badge b-dim">API ONLY</span>
</div>
</body></html>
