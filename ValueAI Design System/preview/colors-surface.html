<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-0); padding:16px; font-family:var(--font-mono); }
  .row { display:flex; gap:4px; }
  .swatch { flex:1; height:56px; border-radius:var(--r-2); display:flex; flex-direction:column; justify-content:flex-end; padding:6px 8px; border:1px solid rgba(255,255,255,0.06); }
  .label { font-size:10px; color:rgba(255,255,255,0.4); line-height:1; }
  .val { font-size:9px; color:rgba(255,255,255,0.25); margin-top:2px; }
</style>
</head><body>
<div class="row">
  <div class="swatch" style="background:#05070b"><span class="label">bg-0</span><span class="val">#05070b</span></div>
  <div class="swatch" style="background:#0a0d14"><span class="label">bg-1</span><span class="val">#0a0d14</span></div>
  <div class="swatch" style="background:#10141d"><span class="label">bg-2</span><span class="val">#10141d</span></div>
  <div class="swatch" style="background:#161b27"><span class="label">bg-3</span><span class="val">#161b27</span></div>
  <div class="swatch" style="background:#1f2533"><span class="label">bg-4</span><span class="val">#1f2533</span></div>
</div>
</body></html>
