<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-1); padding:16px 20px; }
  .row { display:flex; flex-direction:column; gap:10px; }
  .line { display:flex; align-items:baseline; gap:12px; }
  .bar { width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:3px; }
  .txt { font-family:var(--font-sans); font-size:15px; font-weight:400; }
  .meta { font-family:var(--font-mono); font-size:10px; color:#3e455a; }
</style>
</head><body>
<div class="row">
  <div class="line"><div class="bar" style="background:#e8ecf4"></div><span class="txt" style="color:#e8ecf4">Primary text — fg-1</span><span class="meta">#e8ecf4</span></div>
  <div class="line"><div class="bar" style="background:#a8b0c0"></div><span class="txt" style="color:#a8b0c0">Secondary text — fg-2</span><span class="meta">#a8b0c0</span></div>
  <div class="line"><div class="bar" style="background:#6b7488"></div><span class="txt" style="color:#6b7488">Tertiary / metadata — fg-3</span><span class="meta">#6b7488</span></div>
  <div class="line"><div class="bar" style="background:#3e455a"></div><span class="txt" style="color:#3e455a">Disabled — fg-4</span><span class="meta">#3e455a</span></div>
</div>
</body></html>
