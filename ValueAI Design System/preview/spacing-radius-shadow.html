<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{background:var(--bg-1);margin:0;padding:16px 20px;font-family:var(--font-mono);}
  .row{display:flex;gap:12px;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;}
  .box{background:var(--bg-2);border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:10px 14px;font-size:10px;color:var(--fg-3);}
  .label{font-size:10px;color:var(--fg-4);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.09em;}
</style></head><body>
<div class="label">radius</div>
<div class="row">
  <div class="box" style="border-radius:var(--r-0);width:40px;height:40px">r-0</div>
  <div class="box" style="border-radius:var(--r-1);width:40px;height:40px">r-1<br>2px</div>
  <div class="box" style="border-radius:var(--r-2);width:40px;height:40px">r-2<br>4px</div>
  <div class="box" style="border-radius:var(--r-3);width:40px;height:40px">r-3<br>6px</div>
  <div class="box" style="border-radius:var(--r-4);width:40px;height:40px">r-4<br>10px</div>
  <div class="box" style="border-radius:var(--r-pill);height:40px;padding:0 16px">pill</div>
</div>
<div class="label">elevation / glow</div>
<div class="row">
  <div class="box" style="width:80px;height:48px;box-shadow:var(--shadow-1)">sh-1</div>
  <div class="box" style="width:80px;height:48px;box-shadow:var(--shadow-2)">sh-2</div>
  <div class="box" style="width:80px;height:48px;box-shadow:var(--shadow-3)">sh-3</div>
  <div class="box" style="width:80px;height:48px;box-shadow:var(--glow-electric);border-color:var(--electric)">⚡ glow</div>
  <div class="box" style="width:80px;height:48px;box-shadow:var(--glow-cyan);border-color:var(--cyan)">cyan</div>
</div>
</body></html>
