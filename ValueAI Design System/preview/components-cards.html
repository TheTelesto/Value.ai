<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-1); padding:16px 20px; font-family:var(--font-sans); }
  .card { background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-3); padding:14px 16px; transition:all 220ms cubic-bezier(0.2,0.7,0.1,1); cursor:pointer; }
  .card:hover { background:var(--bg-3); border-color:var(--line-3); transform:translateY(-2px); box-shadow:var(--shadow-2); }
  .card-active { box-shadow:var(--glow-electric); border-color:var(--electric); }
  .card-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .model-name { font-weight:600; font-size:15px; color:var(--fg-1); }
  .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:var(--r-pill); font-family:var(--font-mono); font-size:10px; background:rgba(61,220,151,0.12); color:var(--good); border:1px solid rgba(61,220,151,0.25); }
  .meta-row { display:flex; gap:16px; }
  .meta { font-family:var(--font-mono); font-size:12px; color:var(--fg-3); }
  .price { font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--fg-1); margin-top:8px; }
  .price-unit { font-size:13px; color:var(--fg-3); font-weight:400; }
  .value-dots { display:flex; gap:3px; margin-top:10px; }
  .vd { width:14px; height:6px; border-radius:2px; }
</style>
</head><body>
<div style="display:flex;gap:10px;flex-wrap:wrap;">
  <div class="card card-active" style="width:200px;">
    <div class="card-header">
      <div class="model-name">Claude Sonnet 4</div>
      <span class="badge">● BEST VALUE</span>
    </div>
    <div class="meta-row">
      <span class="meta">200k ctx</span>
      <span class="meta">$3/1M</span>
    </div>
    <div class="price">$20<span class="price-unit">/mo</span></div>
    <div class="value-dots">
      <div class="vd" style="background:#3ddc97"></div>
      <div class="vd" style="background:#3ddc97"></div>
      <div class="vd" style="background:#3ddc97"></div>
      <div class="vd" style="background:#3ddc97"></div>
      <div class="vd" style="background:#1f2533"></div>
    </div>
  </div>
  <div class="card" style="width:200px;">
    <div class="card-header">
      <div class="model-name">GPT-4o</div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-4)">OpenAI</span>
    </div>
    <div class="meta-row">
      <span class="meta">128k ctx</span>
      <span class="meta">$5/1M</span>
    </div>
    <div class="price">$20<span class="price-unit">/mo</span></div>
    <div class="value-dots">
      <div class="vd" style="background:#87dc5f"></div>
      <div class="vd" style="background:#87dc5f"></div>
      <div class="vd" style="background:#87dc5f"></div>
      <div class="vd" style="background:#1f2533"></div>
      <div class="vd" style="background:#1f2533"></div>
    </div>
  </div>
</div>
</body></html>
