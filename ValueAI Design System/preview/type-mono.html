<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>* { margin:0; box-sizing:border-box; } body { background:var(--bg-1); padding:16px 20px; }</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:10px;">
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:0.12em;text-transform:uppercase">[ EYEBROW LABEL ]</div>
  <div style="display:flex;align-items:baseline;gap:12px;">
    <span style="font-family:var(--font-mono);font-size:48px;font-weight:700;color:var(--fg-1);letter-spacing:-0.02em;line-height:1">$20</span>
    <span style="font-family:var(--font-mono);font-size:18px;font-weight:400;color:var(--fg-3)">/mo</span>
    <span style="font-family:var(--font-mono);font-size:14px;color:var(--good);margin-left:8px">▲ best value</span>
  </div>
  <div style="display:flex;gap:16px;margin-top:4px;">
    <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg-2)">GPT-4o</span>
    <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg-3)">128k ctx</span>
    <span style="font-family:var(--font-mono);font-size:13px;color:var(--fg-3)">$0.005/1k tok</span>
  </div>
  <div style="border:1px solid var(--line-1);margin:4px 0;"></div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4);letter-spacing:0.08em">MONO · NUMBERS · METADATA</div>
</div>
</body></html>
