<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{background:var(--bg-1);margin:0;padding:16px 20px;font-family:var(--font-mono);}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .bar{background:var(--electric);height:10px;border-radius:1px;opacity:0.7;}
  .meta{font-size:10px;color:var(--fg-3);min-width:80px;}
  .val{font-size:10px;color:var(--fg-2);}
</style></head><body>
<div class="row"><div class="bar" style="width:2px"></div><div class="meta">--sp-0</div><div class="val">2px</div></div>
<div class="row"><div class="bar" style="width:4px"></div><div class="meta">--sp-1</div><div class="val">4px</div></div>
<div class="row"><div class="bar" style="width:8px"></div><div class="meta">--sp-2</div><div class="val">8px</div></div>
<div class="row"><div class="bar" style="width:12px"></div><div class="meta">--sp-3</div><div class="val">12px</div></div>
<div class="row"><div class="bar" style="width:16px"></div><div class="meta">--sp-4</div><div class="val">16px</div></div>
<div class="row"><div class="bar" style="width:24px"></div><div class="meta">--sp-5</div><div class="val">24px</div></div>
<div class="row"><div class="bar" style="width:32px"></div><div class="meta">--sp-6</div><div class="val">32px</div></div>
<div class="row"><div class="bar" style="width:48px"></div><div class="meta">--sp-7</div><div class="val">48px</div></div>
<div class="row"><div class="bar" style="width:64px"></div><div class="meta">--sp-8</div><div class="val">64px</div></div>
<div class="row"><div class="bar" style="width:96px"></div><div class="meta">--sp-9</div><div class="val">96px</div></div>
</body></html>
