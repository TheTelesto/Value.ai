<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-1); padding:16px; font-family:var(--font-mono); }
  .row { display:flex; gap:6px; }
  .chip { flex:1; border-radius:var(--r-3); padding:10px 12px; border:1px solid rgba(255,255,255,0.08); }
  .top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .name { font-size:10px; font-weight:500; line-height:1; }
  .ex { font-size:9px; line-height:1.4; }
  .value-row { display:flex; gap:3px; margin-top:12px; }
  .vs { flex:1; height:20px; border-radius:2px; }
</style>
</head><body>
<div class="row">
  <div class="chip" style="background:#0d1a12">
    <div class="top"><div class="dot" style="background:#3ddc97"></div><span class="name" style="color:#3ddc97">GOOD</span></div>
    <div class="ex" style="color:#3ddc97">Best value</div>
  </div>
  <div class="chip" style="background:#1a1608">
    <div class="top"><div class="dot" style="background:#ffb547"></div><span class="name" style="color:#ffb547">WARN</span></div>
    <div class="ex" style="color:#ffb547">Watch price</div>
  </div>
  <div class="chip" style="background:#1a0c0d">
    <div class="top"><div class="dot" style="background:#ff5d6c"></div><span class="name" style="color:#ff5d6c">BAD</span></div>
    <div class="ex" style="color:#ff5d6c">Poor value</div>
  </div>
</div>
<div class="value-row">
  <div class="vs" style="background:#3ddc97"></div>
  <div class="vs" style="background:#87dc5f"></div>
  <div class="vs" style="background:#ffd042"></div>
  <div class="vs" style="background:#ff8c42"></div>
  <div class="vs" style="background:#ff5d6c"></div>
</div>
</body></html>
