<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-1); padding:16px 20px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .spc { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .bar { background:var(--electric); opacity:0.5; border-radius:1px; width:100%; }
  .lbl { font-family:var(--font-mono); font-size:9px; color:var(--fg-4); text-align:center; }
  .val { font-family:var(--font-mono); font-size:9px; color:var(--fg-3); }
</style>
</head><body>
<div class="row">
  <div class="spc" style="width:14px"><div class="bar" style="height:4px"></div><div class="lbl">sp-1</div><div class="val">4</div></div>
  <div class="spc" style="width:18px"><div class="bar" style="height:8px"></div><div class="lbl">sp-2</div><div class="val">8</div></div>
  <div class="spc" style="width:22px"><div class="bar" style="height:12px"></div><div class="lbl">sp-3</div><div class="val">12</div></div>
  <div class="spc" style="width:26px"><div class="bar" style="height:16px"></div><div class="lbl">sp-4</div><div class="val">16</div></div>
  <div class="spc" style="width:34px"><div class="bar" style="height:24px"></div><div class="lbl">sp-5</div><div class="val">24</div></div>
  <div class="spc" style="width:42px"><div class="bar" style="height:32px"></div><div class="lbl">sp-6</div><div class="val">32</div></div>
  <div class="spc" style="width:58px"><div class="bar" style="height:48px"></div><div class="lbl">sp-7</div><div class="val">48</div></div>
  <div class="spc" style="width:72px"><div class="bar" style="height:64px"></div><div class="lbl">sp-8</div><div class="val">64</div></div>
  <div class="spc" style="width:96px"><div class="bar" style="height:80px"></div><div class="lbl">sp-9</div><div class="val">96</div></div>
</div>
</body></html>
