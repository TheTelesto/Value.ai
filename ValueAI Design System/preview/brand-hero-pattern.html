<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg-0); padding:20px 24px; position:relative; overflow:hidden; }
  body::before { content:''; position:absolute; inset:0; background:var(--scanline); pointer-events:none; z-index:0; }
  .glow { position:absolute; top:-40px; left:40px; width:300px; height:200px; background:radial-gradient(ellipse, rgba(77,124,255,0.12) 0%, transparent 70%); pointer-events:none; }
  .content { position:relative; z-index:1; }
  .eyebrow { font-family:var(--font-mono); font-size:11px; color:var(--fg-4); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:12px; }
  .hero { font-family:var(--font-sans); font-size:clamp(32px,5vw,52px); font-weight:800; color:var(--fg-1); line-height:0.96; letter-spacing:-0.025em; margin-bottom:6px; }
  .hero em { font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; color:var(--fg-2); }
  .sub { font-family:var(--font-sans); font-size:15px; color:var(--fg-3); line-height:1.5; max-width:400px; margin-top:10px; }
  .stat-row { display:flex; gap:24px; margin-top:16px; }
  .stat { display:flex; flex-direction:column; }
  .stat-n { font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--fg-1); }
  .stat-l { font-family:var(--font-mono); font-size:10px; color:var(--fg-4); text-transform:uppercase; letter-spacing:0.1em; }
</style>
</head><body>
<div class="glow"></div>
<div class="content">
  <div class="eyebrow">[ REAL-TIME AI PLAN INTELLIGENCE ]</div>
  <div class="hero">Every model.<br><em>One clear</em><br>verdict.</div>
  <div class="sub">Compare capabilities, pricing, and value across every major AI provider — updated as they change.</div>
  <div class="stat-row">
    <div class="stat"><span class="stat-n" style="color:var(--electric)">47</span><span class="stat-l">MODELS TRACKED</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--cyan)">12</span><span class="stat-l">PROVIDERS</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--good)">∞</span><span class="stat-l">FREE TO COMPARE</span></div>
  </div>
</div>
</body></html>
